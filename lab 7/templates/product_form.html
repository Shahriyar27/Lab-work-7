{% extends 'base.html' %}
{% block content %}
<section class="panel">
<h1>{{ 'Редактирование товара' if editing else 'Новый товар' }}</h1>
<form method="post">
  <label for="name">Название</label>
  <input id="name" name="name" value="{{ product.name if product else '' }}" required>
  <label for="category">Категория</label>
  <input id="category" name="category" value="{{ product.category if product else '' }}" required>
  <label for="price">Цена, $</label>
  <input id="price" name="price" type="number" min="0" max="1000000000" step="0.01" value="{{ product.price if product else '' }}" required>
  <button>Сохранить</button>
</form>
<a href="{{ url_for('products') }}">Вернуться к товарам</a>
</section>
{% endblock %}
